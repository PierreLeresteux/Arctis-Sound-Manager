clips_install_venv=Clips ne peut pas fonctionner avec cette installation d'ASM. Elle tourne dans un environnement Python isolé (installation pipx ou venv), et PyGObject est un paquet système qu'un tel environnement ne voit pas, quel que soit le nombre de fois où il est installé. Utilisez le paquet ASM de votre distribution, ou recréez l'environnement avec --system-site-packages.
