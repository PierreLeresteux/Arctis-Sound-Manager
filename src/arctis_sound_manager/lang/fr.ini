clips_install_intro2=Clips est facultatif : il nécessite des logiciels d'enregistrement d'écran (GStreamer, PyGObject et ffmpeg) inutiles pour un usage purement audio, et n'est donc installé que si vous le demandez ici. Rien ci-dessous n'est modifié avant que vous cliquiez sur Installer.
