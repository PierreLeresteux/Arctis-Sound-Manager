[project]
name = "arctis-sound-manager"
version = "1.7.3"
description = "A replacement for SteelSeries GG software, to manage your Arctis device on Linux!"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "babel>=2.13.0",
    "dbus-next>=0.2.3",
    "pillow>=10.0.0",
    "hidapi>=0.14.0; sys_platform == 'darwin'",
    # The software equaliser on macOS (soft_eq.py): sample buffers and audio I/O.
    "numpy>=1.26; sys_platform == 'darwin'",
    "sounddevice>=0.5; sys_platform == 'darwin'",
    "pulsectl>=24.12.0; sys_platform == 'linux'",
    "pyside6>=6.10.1; sys_platform != 'darwin'",
    # Qt 6.11.3 is the first that does not crash when the menu bar icon is
    # clicked on macOS 27 (QCocoaSystemTrayIcon read clickCount off a
    # non-mouse event).
    "pyside6>=6.11.3; sys_platform == 'darwin'",
    "pyudev>=0.24.4; sys_platform == 'linux'",
    "pyusb>=1.3.1",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
asm-daemon = "arctis_sound_manager.scripts.daemon:main"
asm-cli = "arctis_sound_manager.scripts.cli:main"
asm-gui = "arctis_sound_manager.scripts.gui:main"
asm-router = "arctis_sound_manager.scripts.video_router:main"
asm-stream-guard = "arctis_sound_manager.scripts.stream_guard:main"
asm-clipd = "arctis_sound_manager.scripts.clipd:main"
asm-setup = "arctis_sound_manager.scripts.setup:main"
asm-diag-dinit = "arctis_sound_manager.scripts.diag_dinit:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "autoflake>=2.3.1",
    "isort>=7.0.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
markers = [
    "real_sysfs: exercises a real sysfs read, so the fixture that fakes usage pages stands aside",
    "linux_only: holds only on Linux, skipped elsewhere (macOS runs headset control only)",
]

[tool.pyright]
reportUnknownMemberType = "none"
extraPaths = ["src"]
